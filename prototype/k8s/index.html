const BASE='https://kubernetes.io/docs/';

function T(id,name,cn,group,kind,summary,mechanism,boundary,why,primary,secondary,tradeoff,metric,failure,refs,related){topics.push({id,name,cn,group,kind,summary,mechanism,boundary,why,primary,secondary,tradeoff,metric,failure,refs:refs.map(r=>BASE+r),related});}
T('api','kube-apiserver','集群的统一入口','control','运行进程','把人的声明和机器的反馈，转化为可验证、可共享的 API 状态。',['接收 kubectl、控制器和 kubelet 的 API 请求；执行认证、授权与适用的准入检查。','将资源对象持久化至 etcd；通过 List / Watch 让客户端获知变化。','spec 描述期望，status 描述观测；写入成功与工作负载就绪是两个阶段。'],'它不直接运行容器，也不负责挑选节点。业务 HTTP 请求通常不经过它。','多方同时管理集群，需要统一的协议、状态入口和权限边界。','多方并发决策 ↔ 一致且可治理的状态','统一入口 ↔ 吞吐、延迟与可用性','集中状态交互减少耦合，同时引入控制平面的容量与高可用成本。','API 请求延迟、错误率；从提交到 Ready 的耗时需单独衡量。','不可用时，新变更与控制循环受阻；已运行容器和已有转发规则可能继续工作。',['concepts/overview/components/','concepts/security/controlling-access/'],['etcd','manager','scheduler','rbac']);
T('etcd','etcd','持久化集群状态','control','运行进程','保存 Kubernetes API 数据的分布式键值存储。',['保存对象与配置状态，不保存应用数据库文件或容器镜像。','采用共识机制维护一致性；常规 Kubernetes 组件通过 API Server 访问状态。','备份、恢复、磁盘延迟与多数成员可用性共同决定状态层韧性。'],'etcd 不是控制器，也不是应用的持久卷。','控制进程可以重启，但系统必须记得用户要什么、此前记录了什么。','控制进程会失效 ↔ 状态必须可恢复','一致性 ↔ 写入延迟和跨域部署成本','复制增强容错，但丢失多数成员会阻断正常写入，不能无限靠加节点提速。','提交延迟、磁盘延迟、备份可恢复性与恢复时间。','状态写入受阻会影响控制面；已有业务不必然立即停止，但新的协调能力下降。',['concepts/overview/components/','tasks/administer-cluster/configure-upgrade-etcd/'],['api','operator']);
T('scheduler','kube-scheduler','决定 Pod 去哪里','control','运行进程','为尚未绑定节点的 Pod 选择符合约束的节点。',['观察未调度的 Pod，先过滤不满足资源、亲和性、污点等条件的节点。','对可行节点评分，再通过 API 完成绑定。requests 是资源可放置性判断的重要输入。','调度后由该节点的 kubelet 执行；调度器不负责拉镜像。'],'默认调度器不会把运行中的同一个 Pod 搬去另一节点，也不会直接购买机器。','机器是有限且异构的，应用对容量、位置和隔离又有不同要求。','有限资源 ↔ 多样化工作负载需求','资源利用率 ↔ 故障分散与调度速度','紧密装箱节约资源，却可能扩大单节点故障影响；约束过严会产生 Pending。','调度等待时间、不可调度率、碎片率、跨故障域分布。','Pending + FailedScheduling 时检查 requests、可用容量、污点、亲和性与卷拓扑。',['concepts/scheduling-eviction/kube-scheduler/','concepts/scheduling-eviction/assign-pod-node/'],['pod','resources','node','autoscaler']);
T('manager','kube-controller-manager','运行多个控制循环','control','运行进程','把多个各司其职的内置控制器组织在一个进程中运行。',['Deployment、ReplicaSet、Job 等控制器持续观察自己负责的资源。','控制器比较期望和实际，通常通过 API 创建、更新或删除对象。','它们异步协作，失败可重试；一个请求的成功不是所有控制循环已经收敛。'],'这是控制器的运行载体；Deployment 对象本身不是后台进程。','变化和故障持续发生，一次性执行脚本无法保证长期结果。','持续发生的偏差 ↔ 用户期望的稳定结果','拆分职责 ↔ 异步协调和排错复杂度','局部控制循环可组合、可恢复，但必须处理重复事件、冲突和延迟。','控制器队列积压、重试率、收敛时间。','控制器停止时，现有实例可能继续运行，但缺失副本等偏差无法及时修复。',['concepts/architecture/controller/','reference/command-line-tools-reference/kube-controller-manager/'],['deployment','replicaset','job','nodecontroller']);
T('cloud','cloud-controller-manager','接入云厂商资源','control','可选进程','把 Kubernetes 对象与云厂商的节点、负载均衡、路由等能力连接起来。',['观察相关 API 对象，调用云服务 API 实现外部资源变更。','常见职责包括云节点信息、Service 负载均衡与路由管理，具体取决于提供商。','分离云实现，使核心组件不必内置所有云厂商逻辑。'],'不是所有集群都运行它；具体云集成也可能由其他提供商控制器完成。','应用需要一致的声明方式，底层基础设施却来自不同厂商。','统一使用体验 ↔ 云实现差异','自动化供给 ↔ 外部 API 配额、成本与时延','抽象能降低迁移门槛，但不能消除云网络和计费差异。','外部资源就绪时间、失败率、孤儿资源数量。','LoadBalancer 外部地址持续 Pending，可能是云权限、配额或控制器问题。',['concepts/architecture/cloud-controller/'],['service','node','api']);
T('node','Node','承载工作负载的机器','node','API 对象','在 API 中表示一台物理机或虚拟机的容量与健康状态。',['kubelet 上报节点状态，并续约 Lease 心跳。','调度器依据 allocatable 和约束为节点分配 Pod。','节点条件、污点与驱逐策略共同影响后续调度和故障处理。'],'Node 对象不是机器本身；创建一个 Node 对象不会自动创建云主机。','需要把硬件差异转换成可调度、可观察的资源供给。','异构机器 ↔ 统一资源模型','资源共享 ↔ 故障域隔离','统一抽象方便调度，但仍需关注 GPU、磁盘、网络和可用区差异。','Ready 节点数、可分配资源、资源压力、故障域分布。','NotReady 可能源于机器、网络或 kubelet；仅看对象状态不足以定位根因。',['concepts/architecture/nodes/'],['kubelet','scheduler','nodecontroller']);
T('kubelet','kubelet','节点上的执行代理','node','运行进程','让分配到本节点的 Pod 以声明的方式运行，并持续报告状态。',['从 API 等来源获取 Pod 定义，通过 CRI 请求容器运行时执行。','协调卷挂载、探针和容器生命周期；根据重启策略处理容器失败。','向 API 上报 Pod / Node 状态，使用 Lease 维持节点心跳。'],'不决定集群副本总数，也不负责全局调度。','中心负责全局决策，机器上的执行和故障感知必须靠本地代理完成。','全局期望 ↔ 节点现实状态','本地自治 ↔ 与控制面状态同步','分布式执行降低中心负担，但状态传递存在延迟，断联不等于进程已停止。','容器启动耗时、探针失败、节点心跳与状态新鲜度。','容器不断重启先看退出码、日志与探针；创建失败还需检查运行时、网络和卷。',['concepts/overview/components/','concepts/workloads/pods/pod-lifecycle/'],['runtime','probes','pod','csi']);
T('runtime','Container runtime','真正创建容器','node','运行进程','通过 CRI 为 kubelet 提供容器与 Pod sandbox 的运行能力。',['containerd、CRI-O 等实现镜像与容器生命周期能力。','接收拉取镜像、创建、启动、停止容器等请求。','Linux 环境下配合底层运行时与内核隔离、资源控制机制运行进程。'],'容器运行时不决定应用副本数；Kubernetes 本身不构建应用镜像。','编排需要跨运行时工作，不应绑定某一个容器产品。','统一编排协议 ↔ 多种运行时实现','可替换性 ↔ 调试链路与兼容成本','CRI 将编排与执行解耦，但排障必须分清 API、kubelet 和运行时层。','镜像拉取耗时、容器创建成功率、运行时可用性。','ImagePullBackOff 可能是镜像名称、仓库网络或凭据问题，重复创建 Pod 未必解决。',['concepts/containers/cri/','setup/production-environment/container-runtimes/'],['kubelet','pod','cni']);
T('pod','Pod','最小调度与部署单元','node','API 对象','把需要一起运行的一个或多个容器，组织为共享环境的工作单元。',['同一 Pod 的容器共享网络命名空间，可以通过 localhost 通信，并可共享声明的卷。','一个 Pod UID 只绑定一个节点；替换实例使用新 UID，而不是原 Pod 跨节点迁移。','生命周期阶段与 Ready 条件不同：Running 不意味着已经能接流量。'],'裸 Pod 没有高级控制器负责补建；Pod 也不等同于单个容器。','紧密协作的进程需要共同调度与共享上下文。','共同生命周期需求 ↔ 单容器隔离粒度','协作便利 ↔ 故障与扩缩容耦合','把无关服务放进一个 Pod 会让它们绑定扩容和发布，削弱独立演进。','Ready 比例、启动时间、重启次数与应用成功率。','Pod 被删除后，只有相关控制器仍存在且条件满足，才会产生替代实例。',['concepts/workloads/pods/','concepts/workloads/pods/pod-lifecycle/'],['replicaset','kubelet','probes','service']);
T('proxy','kube-proxy','实现 Service 转发规则','node','可选进程','将 Service 与 EndpointSlice 信息转化为节点上的网络转发规则。',['观察 Service 和端点变化，更新对应的数据平面规则。','业务数据包由实际网络数据平面处理，不必逐个经过 kube-proxy 进程。','某些网络方案提供替代实现，因此集群不一定运行 kube-proxy。'],'它不是七层 Ingress 控制器，也不等同于 CNI。','Pod 地址会变，客户端需要稳定入口和可更新的后端路由。','稳定访问入口 ↔ 动态后端集合','转发性能 ↔ 规则规模与更新时延','规则驱动转发效率较高，但控制信息变化到数据平面生效存在时间差。','Service 连通性、规则同步耗时、连接错误率。','Service 有端点但访问失败，需检查实现、网络策略、端口与路由。',['reference/networking/virtual-ips/','concepts/overview/components/'],['service','endpoints','cni']);
T('cni','CNI 网络插件','让 Pod 互相可达','node','扩展实现','为 Pod 配置网络接口和地址，并由网络方案提供跨节点连通能力。',['运行时在创建 Pod 网络时调用 CNI 插件完成配置。','网络方案可使用路由、隧道或其他方式连接不同节点上的 Pod。','NetworkPolicy 和 Service 替代实现是否支持，要看所选方案。'],'CNI 是接口规范；具体插件不自动拥有所有网络功能。','进程分散在不同机器，应用需要稳定的网络连通语义。','跨主机隔离 ↔ 应用互联需求','网络抽象 ↔ 性能、可观察性和运维复杂度','不同方案在封装开销、地址管理、策略和平台兼容性上做不同取舍。','Pod 连通性、丢包、网络延迟、地址池余量。','FailedCreatePodSandBox 常需要检查网络插件、IP 地址池与节点配置。',['concepts/extend-kubernetes/compute-storage-net/network-plugins/'],['pod','proxy','networkpolicy']);
T('deployment','Deployment','管理无状态应用发布','workload','对象 + 控制器','声明副本与 Pod 模板，并协调 ReplicaSet 完成版本更新。',['Deployment 控制器根据 Pod 模板创建或复用 ReplicaSet。','滚动更新通过调整新旧 ReplicaSet 副本数推进；maxSurge / maxUnavailable 表达发布约束。','状态条件报告推进情况；可通过修改模板或显式回滚恢复此前版本。'],'Deployment 通常不直接创建 Pod；失败发布也不默认自动回滚。','应用必须不断更新，而用户希望服务不中断。','版本变化 ↔ 服务连续性','更新速度 ↔ 冗余资源与回滚复杂度','额外副本换取可用性；探针错误或容量不足仍可能使发布停滞。','发布完成耗时、可用副本、发布失败率与回滚恢复时间。','ProgressDeadlineExceeded 表示发布未按期推进，需要检查并处理，不代表已自动回滚。',['concepts/workloads/controllers/deployment/'],['replicaset','pod','probes','pdb']);
T('replicaset','ReplicaSet','维持指定副本数量','workload','对象 + 控制器','让匹配选择器且由其管理的 Pod 数量趋近期望数量。',['观察副本差额，创建缺失 Pod 或删除多余 Pod。','使用标签选择器确定匹配范围，通过 ownerReferences 建立归属关系。','通常由 Deployment 管理，不建议为了发布而手工维护多个 ReplicaSet。'],'维持数量不保证业务健康；Pod NotReady 不一定触发立刻补建。','单个实例会消失，但服务需要维持足够执行单元。','实例损失 ↔ 副本数量目标','快速补齐 ↔ 资源容量与下游执行速度','数量控制保持简单，把发布策略交给 Deployment，把容器重启交给 kubelet。','期望、实际、Ready 副本差额及持续时间。','控制器创建了新 Pod 但仍 Pending 时，瓶颈可能已经转移到调度或存储。',['concepts/workloads/controllers/replicaset/'],['deployment','pod','scheduler']);
T('statefulset','StatefulSet','保持身份与卷关联','workload','对象 + 控制器','为有状态应用提供稳定的序号身份、存储关联和有序管理能力。',['Pod 使用稳定名称与序号；替换 Pod UID 会变化。','volumeClaimTemplates 为副本创建各自 PVC，配合持久存储保持数据关联。','默认 OrderedReady 管理顺序；也可按应用特征配置并行策略和更新方式。'],'不会自动实现数据库复制、主从选举、备份或数据一致性。','数据与副本身份有关，不能像无状态实例一样任意互换。','实例可替换 ↔ 身份与数据连续性','顺序安全 ↔ 恢复和发布速度','稳定身份减少协调难度，应用本身仍需实现正确的分布式数据协议。','数据恢复时间、卷绑定成功率、业务复制滞后。','前序 Pod 不就绪可能阻塞后续；卷可用区或挂载限制也可能阻塞恢复。',['concepts/workloads/controllers/statefulset/'],['pvc','pv','csi','operator']);
T('daemonset','DaemonSet','在符合条件的节点运行代理','workload','对象 + 控制器','确保符合条件的节点上有对应的节点级 Pod。',['节点新增或符合条件时创建 Pod，节点移除或不再适用时清理。','常用于日志采集、节点监控和网络代理。','通过节点选择、亲和性、容忍等控制覆盖范围。'],'不按业务流量扩副本；并不意味着所有节点无条件各有一个。','节点级能力必须随机器规模一起覆盖，人工逐台部署不可持续。','节点动态增减 ↔ 基础服务持续覆盖','全节点覆盖 ↔ 系统资源开销','统一部署减少遗漏，但错误更新可能同时影响很多节点。','目标节点覆盖率、更新进度、代理资源消耗。','少数节点缺代理时，检查调度条件、污点和资源余量。',['concepts/workloads/controllers/daemonset/'],['node','cni','observability']);
T('job','Job / CronJob','完成任务与周期触发','workload','对象 + 控制器','Job 追踪任务完成；CronJob 按计划创建 Job。',['Job 使用 completions、parallelism、backoffLimit 等约束完成与重试。','CronJob 通过时间计划、并发策略和期限控制 Job 的创建。','应用必须考虑重复执行、幂等和外部副作用。'],'不是精确一次执行保证；CronJob 的创建时机也不是硬实时承诺。','任务关注完成结果，而常驻服务关注持续可用，生命周期目标不同。','任务必须完成 ↔ 执行可能失败','自动重试 ↔ 重复副作用与资源成本','重试提高完成概率，但支付、发信等操作需要业务幂等设计。','任务成功率、完成时长、重试次数与逾期率。','反复失败时检查业务退出码；任务“执行过”不等于结果只产生一次。',['concepts/workloads/controllers/job/','concepts/workloads/controllers/cron-jobs/'],['pod','manager','resources']);
T('hpa','HPA','按指标调整副本数','workload','对象 + 控制器','根据观测指标，调整目标工作负载的期望副本数。',['通过 scale 子资源调整 Deployment 等目标，不直接运行容器。','CPU 利用率目标依赖资源 requests；资源指标通常需要 Metrics Server 等指标管线。','基础比例为 ceil(当前副本 × 当前指标 / 目标指标)，实际还考虑容忍区间、稳定窗口、缺失指标与扩缩策略。'],'不会直接增加节点；没有指标、超过 maxReplicas 或资源不足时可能无法满足负载。','业务需求随时间变化，固定容量会在浪费与过载之间摇摆。','波动需求 ↔ 静态容量','响应速度 ↔ 扩缩抖动与成本','更快扩容可降低过载风险；稳定窗口减少抖动，也延迟收缩。','扩容后业务延迟、指标可用性、饱和时间与副本成本。','HPA 已提高目标但 Pod Pending，说明副本决策之后还有集群容量约束。',['concepts/workloads/autoscaling/horizontal-pod-autoscale/'],['deployment','resources','autoscaler','observability']);
T('nodecontroller','Node 生命周期控制','处理节点失联','workload','内置控制器','根据节点状态和心跳识别异常，并与污点驱逐等机制协作处理受影响 Pod。',['Node 控制逻辑观察 Node 状态和 Lease 心跳。','不健康或失联的节点会反映为相应条件、污点；驱逐受容忍时间等影响。','Pod 被删除后，工作负载控制器可创建新实例；调度器再选择健康节点。'],'失联不证明旧进程已经停止；有状态工作负载还要防止双写与重复身份。','节点可能断联，但平台必须在误判和延迟恢复之间做选择。','故障恢复需求 ↔ 分布式故障检测的不确定性','快速替换 ↔ 误驱逐与双运行风险','等待阈值降低误判，却增加恢复时间；应用一致性不能仅靠节点状态保证。','故障检测时间、驱逐等待、替代 Pod Ready 时间。','节点失联后的恢复不是瞬时搬迁；容量、卷挂载和应用协议都会影响恢复。',['concepts/architecture/nodes/','concepts/scheduling-eviction/taint-and-toleration/'],['node','replicaset','scheduler','statefulset']);
T('service','Service','为动态实例提供稳定入口','network','API 对象','用稳定的服务抽象，把客户端与一组可变化的后端解耦。',['常见 Service 通过 selector 关联 Pod，EndpointSlice 记录后端地址与条件。','ClusterIP、NodePort、LoadBalancer 等类型表达不同暴露方式。','Headless Service 不分配普通 ClusterIP，允许发现后端地址。'],'Service 不是一个独立代理进程；它不提供完整七层路由，也不保证后端业务正确。','Pod 会被替换，调用方不能随着每次替换重写地址。','地址变化 ↔ 调用关系稳定','统一入口 ↔ 后端更新时延与连接语义','稳定发现降低耦合，但存量连接、就绪判断与后端变更仍需正确处理。','连接成功率、Ready 端点数、端点传播延迟。','无可用端点时先查 selector、Pod 标签、Readiness 和端口映射。',['concepts/services-networking/service/'],['endpoints','proxy','dns','gateway']);
T('endpoints','EndpointSlice','记录服务后端集合','network','API 对象 + 控制器','将后端地址、端口与就绪等条件组织成可扩展的切片。',['内置控制器通常根据带 selector 的 Service 和匹配 Pod 维护切片。','网络实现观察切片，更新实际转发规则。','后端是否可接流量不仅看 Pod 存在，还要结合 ready、serving、terminating 等条件与配置。'],'EndpointSlice 存储后端信息，本身不转发业务数据包。','后端集合大且变化频繁，需要把发现信息与转发执行分离。','动态后端规模 ↔ 更新和分发成本','切片扩展性 ↔ 多份对象同步复杂度','切片减小单对象更新压力，但仍存在传播延迟与终止连接处理问题。','端点更新延迟、可用端点数、终止连接错误。','Pod Ready 但服务不通时，切片可帮助确认后端是否被发现。',['concepts/services-networking/endpoint-slices/'],['service','pod','proxy']);
T('dns','CoreDNS','把服务名解析成地址','network','常用附加组件','为集群提供基于名称的服务发现。',['观察 Kubernetes 服务信息，提供集群 DNS 解析。','普通 Service 名称通常解析到 ClusterIP；Headless 可解析出后端地址。','Pod 的 DNS 配置决定查询路径和搜索域。'],'DNS 解析成功不代表网络可达、服务健康或权限允许。','名称比易变地址更适合成为应用之间的约定。','实例与地址变化 ↔ 稳定可读的依赖名称','发现便利 ↔ DNS 可用性、缓存与查询开销','统一命名减少配置变更，但 DNS 自身也需要高可用和容量治理。','DNS 请求延迟、错误率、缓存命中率。','域名解析失败先查 DNS；解析成功却超时再查端点、策略和应用。',['concepts/services-networking/dns-pod-service/'],['service','pod','networkpolicy']);
T('gateway','Ingress / Gateway API','管理集群入口流量','network','API + 扩展控制器','通过路由声明和对应实现，把外部请求导向内部服务。',['Ingress 提供常见 HTTP(S) 主机与路径路由规则，需安装对应控制器。','Gateway API 使用 GatewayClass、Gateway、HTTPRoute 等对象划分基础设施与应用职责。','Gateway API 通常需安装相应 CRD 和兼容实现；实际协议与特性取决于实现。'],'只创建路由对象不会凭空产生可用入口；控制器与数据平面可能是不同进程。','多个应用共用入口时，需要在集中治理与团队自助间分工。','共享入口 ↔ 独立应用路由变更','表达能力 ↔ 实现差异与配置复杂度','角色分离提升治理能力，同时带来更多对象、授权与关联状态。','路由生效率、入口错误率、证书与后端健康状态。','排查需逐层看监听器、路由接受状态、Service 后端与数据平面。',['concepts/services-networking/ingress/','concepts/services-networking/gateway/'],['service','networkpolicy','cloud']);
T('networkpolicy','NetworkPolicy','约束 Pod 网络访问','network','策略对象','声明 Pod 的入站和出站允许规则，由支持的网络实现执行。',['基于 Pod、Namespace 选择器与 IP 范围表达允许关系。','入站与出站独立；标准策略规则具有叠加语义。','需要支持 NetworkPolicy 的网络插件；没有执行实现时对象不会生效。'],'Namespace 不自动隔离网络；标准 NetworkPolicy 也不是通用七层授权。','默认互通便于组合服务，但多租户与最小权限需要缩小访问面。','互联便利 ↔ 访问隔离','安全收敛 ↔ 配置与排障成本','默认拒绝加明确放行更易治理，但要同时考虑 DNS 和必要依赖。','非预期连通路径、策略覆盖率、误阻断率。','策略变更后超时，检查两端方向、标签、命名空间选择与 DNS 放行。',['concepts/services-networking/network-policies/'],['cni','namespace','service']);
T('pvc','PVC','应用对存储的申请','storage','API 对象','让应用声明所需容量、访问模式与存储类别。',['PVC 与符合条件的 PV 绑定；也可通过 StorageClass 触发动态供给。','Pod 引用 PVC 获取卷，而无需直接携带云磁盘细节。','延迟绑定策略可以把调度位置与卷的拓扑约束一起考虑。'],'PVC 不等同于真实磁盘，也不会自动复制、备份业务数据。','应用只需表达存储需求，平台负责满足具体供给。','应用存储需求 ↔ 异构基础设施供给','解耦便利 ↔ 绑定、拓扑与回收复杂度','抽象降低应用耦合，但可用区、容量和访问模式仍限制放置位置。','申请到 Bound 的耗时、未绑定数量、存储利用率。','PVC Pending 时检查类别、供给器、配额与绑定模式；可能在等待可调度消费者。',['concepts/storage/persistent-volumes/','concepts/storage/storage-classes/'],['pv','storageclass','csi','statefulset']);
T('pv','PV','平台提供的持久卷','storage','API 对象','描述一个由平台提供的存储资源，其生命周期独立于单个 Pod。',['静态创建或动态供给，绑定到一个 PVC。','包含容量、访问模式、实际存储连接信息与回收策略。','Retain / Delete 等策略影响 PVC 删除后的存储处理。'],'持久化不等于高可用或备份；访问模式也不自动实现数据库并发一致性。','计算实例可以替换，数据却需要延续并可治理地回收。','短暂计算生命周期 ↔ 长期数据生命周期','资源回收效率 ↔ 数据保留与误删风险','自动删除降低遗留成本，保留策略降低误删风险却要求人工或自动治理。','数据恢复成功率、遗留卷成本、容量与延迟。','PVC 删除后的数据命运取决于回收策略与存储实现，不能从 Pod 状态推断。',['concepts/storage/persistent-volumes/'],['pvc','csi','statefulset']);
T('storageclass','StorageClass','定义存储服务等级','storage','API 对象','用命名的存储类别表达供给器和存储策略。',['包含 provisioner、parameters、回收策略、绑定模式等。','PVC 可以选择类别；默认类别可降低应用配置成本。','容量、性能、扩容能力与拓扑行为依赖具体驱动及后端。'],'名称为 fast 不保证某个固定性能水平，服务等级需平台验证。','开发者不应理解每一种磁盘接口，但需要按成本和性能选择。','简化消费 ↔ 能力与成本差异','默认便捷 ↔ 隐性账单和放置限制','把底层差异封装成产品套餐，必须同时暴露性能、边界和价格。','每 GB 成本、延迟目标、供给成功率。','错误默认类别可能使应用申请昂贵或拓扑不匹配的存储。',['concepts/storage/storage-classes/'],['pvc','pv','csi']);
T('csi','CSI 驱动','连接实际存储系统','storage','扩展实现','通过标准接口把 Kubernetes 卷生命周期映射到底层存储操作。',['控制器侧与相关 sidecar 协作执行供给、附加、扩容等支持的操作。','节点侧插件与 kubelet 协作将卷准备并挂载到工作负载。','具体支持的能力由驱动与存储后端共同决定。'],'CSI 是接口标准，不是某一种分布式存储产品。','存储产品很多，核心编排不能为每个后端内置专用逻辑。','统一卷生命周期 ↔ 多样存储系统','可扩展接口 ↔ 插件运行与故障链路','插件化加快厂商迭代，但控制器、节点插件和外部后端都成为排障环节。','供给、附加、挂载耗时与错误率。','Pod 卡在创建阶段且出现 FailedMount 时，应追踪 PVC、驱动与底层存储。',['concepts/storage/volumes/','concepts/storage/persistent-volumes/'],['pvc','kubelet','storageclass']);
T('config','ConfigMap / Secret','分离配置与镜像','govern','API 对象','让同一镜像在不同环境消费不同配置与敏感数据。',['通过环境变量、卷或 API 读取配置。','环境变量不会因对象更新自动刷新；挂载内容更新也受方式和传播延迟影响，应用仍需重新读取。','Secret 用于敏感信息；base64 是编码，不能代替静态加密与最小权限。'],'修改配置不保证业务立即生效；Secret 的名字不构成完整安全保证。','应用代码应可重复交付，而环境配置和凭据需要独立变更。','镜像可复用 ↔ 环境差异与秘密管理','配置灵活性 ↔ 版本一致性和泄露风险','外置配置减少镜像重建，但要管理版本、轮换、重新加载和权限。','配置生效时间、轮换成功率、配置导致的故障率。','对象已更新但应用未变化时，检查注入方式与重载机制，不要只看 API 值。',['concepts/configuration/configmap/','concepts/configuration/secret/'],['pod','rbac','deployment']);
T('namespace','Namespace / Quota','组织多团队共享资源','govern','对象 + 策略','用命名空间组织资源，并以配额限制命名空间的资源消费。',['Namespace 为多数资源提供命名范围，部分资源如 Node / PV 是集群范围。','ResourceQuota 约束聚合资源使用，LimitRange 可约束或默认单个资源请求。','隔离还需结合 RBAC、网络策略、Pod 安全等机制。'],'Namespace 不是虚拟机级安全边界，也不自动提供网络隔离。','多团队共用集群能提高利用率，但不能无限抢占彼此资源。','共享资源效率 ↔ 团队公平与责任边界','自助交付 ↔ 配额审批与碎片','配额保护公平性，也可能在集群仍有空闲时拒绝某个团队的新请求。','配额拒绝率、团队资源利用率、闲置与超额需求。','创建被 Forbidden 拒绝可能是配额或授权，而非调度器容量不足。',['concepts/overview/working-with-objects/namespaces/','concepts/policy/resource-quotas/'],['rbac','networkpolicy','resources']);
T('rbac','RBAC / ServiceAccount','定义谁能做什么','govern','对象 + 授权机制','将身份与操作权限分开，限制对 Kubernetes API 的访问。',['ServiceAccount 为工作负载提供 API 身份；人类身份可来自外部认证系统。','Role / ClusterRole 定义权限，绑定对象把权限授予主体。','认证回答是谁，授权回答能否操作，准入再检查对象是否符合规则。'],'RBAC 主要约束 API 操作，不代替应用登录权限或 Pod 网络策略。','自助平台扩大操作能力，也扩大错误和越权的影响范围。','交付自主性 ↔ 最小权限','细粒度控制 ↔ 角色治理复杂度','过宽权限方便初期操作，却让误操作和凭据泄露的影响扩散。','权限覆盖、过度授权、访问拒绝原因可解释性。','401 优先查身份凭据；403 还可能涉及授权或准入，需读错误内容。',['reference/access-authn-authz/rbac/','concepts/security/service-accounts/','concepts/security/controlling-access/'],['api','namespace','admission']);
T('admission','Admission','在写入前约束对象','govern','API 处理机制','对适用的变更请求进行默认补全、修改或校验。',['在认证授权之后、对象持久化之前参与适用请求。','可用内置准入插件、策略或 Webhook 实现组织约束。','例如限制特权容器、约束镜像来源或强制必要标签。'],'准入不负责持续修复运行状态；Webhook 可用性也会影响 API 写入。','仅知道谁有权限还不够，有权限的人也可能提交不合规配置。','自助变更 ↔ 全局安全和治理约束','强制治理 ↔ 提交时延与外部依赖','同步校验把风险挡在入口，但策略变更和失败处理需避免阻塞整个交付链。','拒绝率、策略误报、Webhook 延迟与可用性。','提交被拒绝时要读准入原因；不要误判为调度失败。',['reference/access-authn-authz/admission-controllers/'],['api','rbac','namespace']);
T('resources','requests / limits','给资源竞争设边界','govern','Pod 配置','用请求量表达调度需求，用上限约束运行时资源使用。',['调度主要考虑 requests 与节点可分配容量，而非仅看瞬时空闲。','CPU limit 通常通过节流约束；内存超限可能触发 OOM。','requests / limits 也影响 QoS 和资源压力下的行为；实际需结合节点配置。'],'requests 不是账面上随意填写的数字；limits 也不保证低延迟。','多个工作负载共享有限 CPU 与内存，需要避免一个应用挤压全部服务。','共享效率 ↔ 可预测性能','保守预留 ↔ 闲置成本和可调度性','requests 过高浪费、过低导致竞争；CPU 限制过紧可能拖慢延迟敏感业务。','使用量相对 requests、CPU 节流、OOM、Pending。','看起来还有空闲但 Pod Pending，可能是请求总量或其他硬约束不满足。',['concepts/configuration/manage-resources-containers/'],['scheduler','hpa','namespace']);
T('probes','健康探针','区分启动、存活与就绪','govern','Pod 配置 + kubelet','用不同信号分别决定何时检查、是否重启以及能否接流量。',['startupProbe 成功前抑制 liveness / readiness 检查，保护慢启动。','liveness 失败达到阈值后触发容器重启，具体行为受重启策略影响。','readiness 失败使 Pod 不就绪，通常从 Service 可接流量后端中排除，但不会因此直接重启容器。'],'进程活着不等于业务健康；错误探针可能放大故障。','系统不能仅靠进程存在来判断应用是否能服务。','机械运行状态 ↔ 真实服务能力','快速发现 ↔ 误判、重启风暴与检测开销','把外部依赖故障放进存活探针可能引发无效重启，应按故障可修复方式设计。','误判率、探测延迟、重启次数和用户请求成功率。','新版本一直不 Ready 会阻塞发布；存活探针配置不当可能导致循环重启。',['concepts/workloads/pods/probes/'],['pod','kubelet','service','deployment']);
T('pdb','PodDisruptionBudget','给自愿驱逐设预算','govern','策略对象 + 控制器','约束通过 Eviction API 发起的自愿驱逐，保护副本可用下限。',['可用 minAvailable 或 maxUnavailable 描述预算。','drain 等遵守 Eviction API 的操作可能因预算不足而等待。','非自愿故障影响可用数，但 PDB 无法阻止机器崩溃。'],'直接删除 Pod 可绕过 PDB；Deployment 滚动更新由自身策略控制。','维护和缩容不可避免，但不能让所有副本同时下线。','基础设施维护 ↔ 业务连续性','更严格保护 ↔ 维护与缩容阻塞','预算不是越严格越好，单副本加严格预算可能让维护长期无法推进。','维护完成时间、驱逐拒绝、业务可用副本。','drain 卡住时检查预算、Ready 数与应用扩容能力，不要把强删当成无损修复。',['concepts/workloads/pods/disruptions/'],['deployment','autoscaler','node']);
T('autoscaler','Node Autoscaling','补充或回收机器容量','extension','生态控制器','根据工作负载需求与策略调整节点供给。',['Cluster Autoscaler、Karpenter 等生态方案有不同决策与供给方式。','可根据无法调度的 Pod、资源约束及节点组或供给规则增加容量。','缩容还受 Pod 可迁移性、PDB、存储和供应商能力约束。'],'不是 HPA；也不是 Kubernetes 安装后必然具备的内置能力。','Pod 副本能增加，但物理容量不会从声明中自动出现。','弹性应用需求 ↔ 有限机器供给','成本收敛 ↔ 启动时间、冗余和迁移风险','自动扩节点减少容量规划负担，但外部配额、实例缺货和启动时延仍存在。','不可调度持续时间、节点启动耗时、闲置成本、缩容失败原因。','扩容失败要检查供应商配额、实例规格、区域容量和调度硬约束。',['concepts/cluster-administration/node-autoscaling/'],['hpa','scheduler','pdb','cloud']);
T('operator','CRD / Operator','把领域知识变成自动化','extension','API 扩展 + 控制器','用自定义资源表达领域目标，再由控制器实现领域运维流程。',['CRD 扩展 API 类型和结构，单独创建 CRD 不会产生执行行为。','Operator 观察自定义资源，协调内置对象或外部系统。','可编码数据库备份、恢复、升级等知识，能力取决于具体实现。'],'自定义对象不天然拥有自愈能力；错误 Operator 也可能自动扩大故障。','通用编排理解副本和卷，却不理解每一种数据库的业务安全条件。','通用机制 ↔ 领域特定运维知识','自动化深度 ↔ 实现、权限和升级复杂度','领域流程自动化减少人工，但需要幂等、状态恢复和版本兼容设计。','任务成功率、人工介入频次、恢复正确性。','资源已创建但无反应，检查控制器是否运行、是否有权限以及 status / Events。',['concepts/extend-kubernetes/operator/','concepts/extend-kubernetes/api-extension/custom-resources/'],['api','manager','statefulset','csi']);
T('observability','指标 / 日志 / Events','让偏差可被定位','extension','内置信号 + 外部系统','把系统行为转化成可解释的证据，支撑人和自动控制器做判断。',['Events 和对象 status 提供控制过程线索；容器日志帮助解释应用行为。','Metrics Server 常用于资源指标，长期指标、日志、链路追踪通常需要额外系统。','HPA 依赖可用指标管线；业务可用性要用请求成功率和延迟等验证。'],'Events 不应当作永久审计库；CPU 低不代表业务成功。','自动化操作数量增加后，人必须仍能解释结果并定位瓶颈。','复杂异步系统 ↔ 可理解与可验证的运行结果','观测覆盖 ↔ 数据成本、基数和噪声','过少观测无法定位，过多无关告警会掩盖真正影响用户的问题。','业务 SLO、告警有效率、发现时间和定位时间。','从用户失败追踪到入口、Service、Pod、节点，避免只在单层看健康灯。',['concepts/cluster-administration/observability/','tasks/debug/debug-cluster/resource-metrics-pipeline/'],['hpa','pod','node','service']);

function save(){try{localStorage.setItem('k8s-atlas-v1',JSON.stringify({read:[...state.read],answers:state.answers}))}catch(e){}}
function progress(){const count=topics.filter(t=>state.read.has(t.id)).length;$('#readCount').textContent=`${count} / ${topics.length}`;$('#readProgress').style.width=`${count/topics.length*100}%`}
function footer(){return `<footer class="footer"><span>内容基于 Kubernetes 官方概念文档 · 资料核对 2026.10.20</span><span>技术事实与产品分析分开呈现 · 教学模型不连接真实集群</span></footer>`}
function head(en,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${en}</div><h1>${title}</h1><p>${desc}</p></div>${action?`<div class="head-action">${action}</div>`:''}</div>`}
function go(page){stop();state.page=page;render();window.scrollTo({top:0,behavior:'instant'})}
function selectTopic(id){if(!byId[id])return;state.selected=id;if(state.page!=='map'){state.page='map';state.filter='all';state.query='';stop();render();window.scrollTo({top:0,behavior:'instant'})}else{renderMapBody();renderInspector()}}
function render(){document.querySelector('.nav').innerHTML=navs.map(([id,n,name])=>`<button data-page="${id}" class="${state.page===id?'active':''}" ${state.page===id?'aria-current="page"':''}><span class="num">${n}</span>${name}</button>`).join('');$('#crumb').textContent=navs.find(n=>n[0]===state.page)[2];if(state.page==='map')renderMap();if(state.page==='principles')renderPrinciples();if(state.page==='controllers')renderControllers();if(state.page==='lab')renderLab();if(state.page==='quiz')renderQuiz();progress()}

$('#view').innerHTML=head('01 / SYSTEM MAP','让系统持续趋近期望。','从一张地图看懂 K8s 的分工。选择节点，追踪它的机制、责任边界与设计原因。',`<button class="btn primary" data-page="lab">跟随一次部署 <span>→</span></button>`)+`<div class="workspace"><div><section class="panel"><div class="panel-top"><span class="panel-title">集群架构 <span class="muted small">/ ${topics.length} 个知识节点</span></span><span class="small muted">点击组件探索</span></div><div style="padding:14px 16px 0"><input class="search" id="search" aria-label="搜索组件、问题或机制" placeholder="搜索组件或问题，如：扩容、存储、为什么 Pending…" value="${esc(state.query)}"></div><div class="filter-row" aria-label="知识分类"><button class="chip ${state.filter==='all'?'active':''}" data-filter="all">全景</button>${Object.entries(groups).map(([id,n])=>`<button class="chip ${state.filter===id?'active':''}" data-filter="${id}">${n.replace('与控制器','').replace('配置、安全与治理','安全与治理')}</button>`).join('')}</div><div id="mapBody"></div><div class="map-footer"><span><i class="legend-line"></i>控制 / 状态交互</span><span><i class="legend-line green"></i>运行时执行</span><span><i class="legend-line dashed"></i>对象归属</span><span>图为职责关系，非物理部署拓扑</span></div></section><div class="callout"><div class="cycle">↻</div><div><strong>核心机制：声明 → 观察 → 比较 → 协调</strong><p>“创建成功”只是目标被记录。多个控制循环持续修正偏差，实际状态才会逐步接近期望状态。</p></div></div><div class="section-note" style="margin-top:13px">蓝色选中节点显示右侧详情；关联节点淡蓝高亮。分类标签包含更多网络、存储与治理对象。</div></div><aside class="panel inspector" id="inspector" aria-label="组件详情"></aside></div>`+footer();
$('#search').addEventListener('input',e=>{state.query=e.target.value;renderMapBody()});renderMapBody();renderInspector();}

function renderMapBody(){const query=state.query.trim().toLowerCase();if(!query&&state.filter==='all'){$('#mapBody').innerHTML=mapSvg();return}const matches=topics.filter(t=>(state.filter==='all'||t.group===state.filter)&&(!query||[t.name,t.cn,t.summary,...t.mechanism,t.why,t.primary,t.failure].join(' ').toLowerCase().includes(query)));$('#mapBody').innerHTML=`<div class="catalog">${matches.length?matches.map(t=>`<button class="catalog-card ${t.id===state.selected?'selected':''}" data-topic="${t.id}"><span class="badge">${esc(t.kind)}</span><h3>${esc(t.name)}</h3><p>${esc(t.cn)}</p></button>`).join(''):`<div class="empty"><h3>没有匹配的知识节点</h3><p>试试「Pod」「调度」「网络」或切换到全景分类。</p><button class="btn" data-clear style="margin-top:16px">清空搜索与分类</button></div>`}</div>`}
function renderInspector(){const t=byId[state.selected],tech=state.tab==='tech';$('#inspector').innerHTML=`<div class="inspect-head"><div style="display:flex;justify-content:space-between;gap:10px"><span class="eyebrow">${groups[t.group]}</span><span class="badge">${t.kind}</span></div><h2>${esc(t.name)}</h2><div class="cn">${t.cn}</div><p style="font-size:13px;line-height:1.8">${t.summary}</p></div><div class="tabbar"><button data-tab="tech" class="${tech?'active':''}" aria-pressed="${tech}">技术机制</button><button data-tab="product" class="${!tech?'active':''}" aria-pressed="${!tech}">产品设计逻辑</button></div><div class="inspect-body">${tech?`<h4>如何运作</h4><ol class="mechanism">${t.mechanism.map(m=>`<li>${m}</li>`).join('')}</ol><div class="boundary"><b>责任边界</b><br>${t.boundary}</div><h4>故障时看哪里</h4><p>${t.failure}</p>`:`<h4>第一性原理 · 为什么需要它</h4><p>${t.why}</p><h4>主要矛盾 · 典型场景下的分析</h4><div class="tension">${t.primary}</div><h4>次要矛盾 · 仍需处理的约束</h4><p>${t.secondary}</p><h4>设计取舍与代价</h4><p>${t.tradeoff}</p><h4>转化为产品判断</h4><p>${t.metric}</p><div class="boundary" style="margin-top:16px">“主要 / 次要”为本原型的分析框架，不是 Kubernetes 官方术语；优先级会随场景变化，次要不等于可忽略。</div>`}<h4>关联知识</h4><div class="related-list">${t.related.map(id=>`<button class="btn" data-topic="${id}">${byId[id].name} ↗</button>`).join('')}</div><h4>官方资料 · 技术依据</h4>${t.refs.map((r,i)=>`<a class="inspect-source" href="${r}" target="_blank" rel="noopener noreferrer">${i+1}. ${r.split('/').filter(Boolean).pop().replaceAll('-',' ')} ↗</a>`).join('')}<button class="btn read-btn ${state.read.has(t.id)?'':'primary'}" data-read="${t.id}">${state.read.has(t.id)?'✓ 已读 · 点击取消':'标记已读'}</button></div>`;}
function topicButtons(ids){return `<div class="related-list">${ids.map(id=>`<button class="btn" data-topic="${id}">${byId[id].name} ↗</button>`).join('')}</div>`}
function renderPrinciples(){let c=contradictions.find(x=>x.id===state.principle);$('#view').innerHTML=head('02 / DESIGN REASONING','先理解问题，再理解组件。','以用户结果、物理约束和失败常态为起点，推导 Kubernetes 为什么需要这些分工。')+`<section class="principle-hero"><div><div class="eyebrow" style="color:#91b4fa;margin-bottom:12px">一个共同的用户任务</div><h2>在有限、会失效的机器上，<br>让应用持续按意图运行。</h2><p>核心主张：把“长期结果”保存为可协调的目标，用多个专职控制循环持续处理现实偏差。</p></div><div class="axioms"><div><b>01</b><span>资源有限：容量、网络和存储都有约束。</span></div><div><b>02</b><span>故障常态：进程会退出，节点会断联。</span></div><div><b>03</b><span>需求变化：流量、版本和组织边界会变化。</span></div><div><b>04</b><span>观测滞后：提交、执行和业务成功是不同状态。</span></div></div></section><div class="section-note">以下为产品分析，而非官方设计动机的历史断言。主要矛盾取决于此刻最阻碍用户目标的约束；安全与数据底线不会因为“次要”就失效。</div><div class="scenario-tabs">${contradictions.map(x=>`<button class="btn ${x.id===c.id?'active':''}" data-principle="${x.id}">${x.name}</button>`).join('')}</div><div class="contradiction-grid"><section class="panel padded"><div class="eyebrow">当前场景 / ${c.name}</div><div class="large-quote">${c.main}</div><p class="small muted">主要矛盾：决定当前设计优先级</p><div class="minor"><strong class="small">次要矛盾与其他约束</strong><p>${c.minor}</p></div><div class="transfer"><strong>什么时候主次会转换？</strong><p style="margin-top:8px">${c.shift}</p></div></section><section class="panel padded"><h3>从不可回避的事实出发</h3><ol class="mechanism" style="margin-top:18px">${c.facts.map(f=>`<li>${f}</li>`).join('')}</ol><h3 style="margin-bottom:12px">因此需要这些机制</h3>${topicButtons(c.nodes)}<div class="transfer"><strong>付出的代价</strong><p style="margin-top:8px">${c.trade}</p></div></section></div><div class="causal-chain">${c.chain.map((s,i)=>`<div class="causal-step"><div class="eyebrow">${String(i+1).padStart(2,'0')} / ${['目标','机制','协作','结果'][i]}</div>${s}</div>`).join('')}</div><div class="callout"><div class="cycle">◎</div><div><strong>产品验收应该观察什么</strong><p>${c.metric}</p></div></div>`+footer()}
function renderControllers(){$('#view').innerHTML=head('03 / RECONCILIATION','一组控制循环，不是一个总管。','API 对象承载目标；控制器运行逻辑；节点组件执行动作。用输入、动作和目标区分它们。',`<button class="btn" data-page="lab">进入场景实验 →</button>`)+`<div class="panel loop-banner"><div><b>01 观察</b><span>读取目标和当前状态</span></div><div><b>02 比较</b><span>判断与目标的差额</span></div><div><b>03 协调</b><span>通过 API 或外部系统执行动作</span></div><div><b>04 再观察</b><span>记录结果，失败重试</span></div></div><div class="section-note">下表为概念职责。多数内置控制器运行在 kube-controller-manager 中；Operator 与其他生态控制器可独立运行。并非所有循环都采用相同触发周期。</div><section class="panel compare-wrap"><table class="compare"><thead><tr><th>对象 / 控制逻辑</th><th>观察什么</th><th>采取什么动作</th><th>追求的结果</th><th>关键边界</th></tr></thead><tbody>${controllerRows.map(([id,input,act,goal,bound])=>`<tr><td><button class="inline-link" data-topic="${id}">${byId[id].name} ↗</button></td><td>${input}</td><td>${act}</td><td>${goal}</td><td>${bound}</td></tr>`).join('')}</tbody></table></section><div class="callout"><div class="cycle">↳</div><div><strong>为什么拆成 Deployment → ReplicaSet → Pod？</strong><p>发布策略、数量维持、单实例运行面对不同目标和失败方式。拆分让每个循环可以专注于自己的偏差，也让各层能被复用；代价是状态异步、排障需要跨层追踪。</p></div></div>`+footer()}
function labSteps(){return labs[state.lab].steps(state.load,state.cap)}
function renderLab(){const lab=labs[state.lab],steps=labSteps();state.step=Math.max(0,Math.min(state.step,steps.length-1));const s=steps[state.step];$('#view').innerHTML=head('04 / SCENARIO LAB','改变条件，看系统如何回应。','逐步观察实际状态如何接近期望，也看清收敛何时会受阻。所有状态均为教学模拟。')+`<div class="scenario-tabs">${Object.entries(labs).map(([id,l])=>`<button class="btn ${state.lab===id?'active':''}" data-lab="${id}">${l.name}</button>`).join('')}</div><div class="lab-layout"><div><section class="panel"><div class="panel-top"><span class="panel-title">应用：demo-web</span><span class="badge">SIMULATION / ${lab.name}</span></div>${state.lab==='scale'?`<div class="lab-control"><label>CPU / requests <input id="loadInput" type="range" min="50" max="150" step="10" value="${state.load}" aria-label="CPU 利用率"><b>${state.load}%</b></label><label>总容量 <select id="capacityInput" aria-label="可调度容量"><option value="4" ${state.cap===4?'selected':''}>4 个槽位 · 紧张</option><option value="8" ${state.cap===8?'selected':''}>8 个槽位 · 充足</option></select></label></div>`:''}<div class="stats"><div class="stat"><small>期望副本 / DESIRED</small><strong>${s.desired}</strong></div><div class="stat"><small>可服务 / READY</small><strong style="color:var(--green)">${s.ready}</strong></div><div class="stat"><small>过渡 / 故障示意</small><strong style="color:var(--amber)">${s.pending+s.failed}</strong></div></div><div class="cluster">${clusterMarkup(s)}<div class="small muted" style="margin-top:15px">${s.extra||'圆点与文字共同表示状态；排列不代表真实调度算法。'}</div></div><div class="playbar"><button class="btn" data-prev ${state.step===0?'disabled':''}>← 上一步</button><button class="btn primary" data-play>${state.playing?'暂停':'自动播放'}</button><button class="btn" data-next ${state.step===steps.length-1?'disabled':''}>下一步 →</button><span class="steps-count">${state.step+1} / ${steps.length}</span></div></section><p class="scenario-note"><b>模型边界：</b>${lab.note}</p><button class="btn small" data-reset style="margin-top:12px">↺ 重置本实验</button></div><section class="panel"><div class="lab-step"><div class="eyebrow">STEP ${String(state.step+1).padStart(2,'0')} / ${lab.issue}</div><h2 class="step-title">${s.title}</h2><div class="step-description" aria-live="polite">${s.desc}</div><div style="margin-top:18px">${topicButtons([s.node])}</div><ol class="timeline">${steps.map((st,i)=>`<li><button class="${i===state.step?'active':''}" data-step="${i}" aria-current="${i===state.step?'step':'false'}"><span class="index">${i<state.step?'✓':String(i+1).padStart(2,'0')}</span>${st.title}</button></li>`).join('')}</ol><div class="minor"><strong class="small">这一刻，先问什么？</strong><p>${state.lab==='scale'?'目标是否已经提高？对象是否创建？能否调度？启动后是否真正减轻业务压力？':state.lab==='rollout'?'新版本是否 Ready？旧版本是否还可用？状态报错后由谁决定修复或回滚？':'偏差在哪一层？谁负责观察它？谁有权采取动作？动作之后还需要哪些条件？'}</p></div></div></section></div>`+footer();if($('#loadInput'))$('#loadInput').addEventListener('change',e=>{stop();state.load=Number(e.target.value);renderLab()});if($('#capacityInput'))$('#capacityInput').addEventListener('change',e=>{stop();state.cap=Number(e.target.value);renderLab()})}
function clusterMarkup(s){let pods=[];for(let i=0;i<s.ready;i++)pods.push(`<span class="pod-box"><i class="pod-dot"></i>web-${i+1} · Ready</span>`);for(let i=0;i<s.pending;i++)pods.push(`<span class="pod-box pending"><i class="pod-dot"></i>${s.label==='v2'?'v2':'new-'+(i+1)} · 待推进</span>`);for(let i=0;i<s.failed;i++)pods.push(`<span class="pod-box failed"><i class="pod-dot"></i>${state.lab==='rollout'?'v2 · NotReady':state.lab==='crash'?'容器退出':state.lab==='nodefail'?'实例失联':'旧实例已删除'}</span>`);return `<div class="machine"><div class="machine-head"><span class="mono">WORKLOAD INSTANCES</span><span>${state.lab==='scale'?state.cap+' 槽位':'示意实例集合'}</span></div><div class="pods">${pods.join('')||'<span class="small muted">尚未创建工作负载实例</span>'}</div></div><div class="machine"><div class="machine-head"><span class="mono">SERVICE / demo-web</span><span style="color:${s.ready?'var(--green)':'var(--amber)'}">${s.ready?'有就绪后端':'等待就绪后端'}</span></div><p class="small muted">${s.ready?`${s.ready} 个 Ready 实例可被发现。端点与转发规则的异步传播在此简化展示。`:'本步骤没有 Ready 实例。入口对象存在也不代表应用可以访问。'}</p></div>`}
function stop(){if(timer){clearInterval(timer);timer=null}state.playing=false}
function play(){if(state.playing){stop();renderLab();return}if(state.step>=labSteps().length-1)state.step=0;state.playing=true;renderLab();timer=setInterval(()=>{if(state.page!=='lab'){stop();return}if(state.step<labSteps().length-1)state.step++;if(state.step>=labSteps().length-1)stop();renderLab()},4500)}
function renderQuiz(){let answered=quizzes.filter((q,i)=>Number.isInteger(state.answers[i])).length,correct=quizzes.filter((q,i)=>state.answers[i]===q.right).length;$('#view').innerHTML=head('05 / CHECK YOUR MODEL','能解释边界，才算理解机制。','先判断，再看因果解释。答案保存在当前浏览器，可随时重做。',`<span class="score">${correct} / ${quizzes.length} 答对 · ${answered} 已作答</span>`)+`<div class="quiz-list">${quizzes.map((q,i)=>{let a=state.answers[i],done=Number.isInteger(a);return `<section class="panel question"><div class="eyebrow">QUESTION ${String(i+1).padStart(2,'0')}</div><h3>${q.q}</h3><div class="answers">${q.a.map((v,j)=>`<button class="answer ${done&&j===q.right?'correct':done&&j===a?'wrong':''}" data-answer="${i}:${j}" aria-pressed="${a===j}">${String.fromCharCode(65+j)}. ${v}</button>`).join('')}</div>${done?`<div class="explanation"><b style="color:${a===q.right?'var(--green)':'var(--red)'}">${a===q.right?'回答正确':'再看一下职责边界'}</b><p style="margin:7px 0 10px">${q.why}</p><button class="inline-link" data-topic="${q.node}">回到 ${byId[q.node].name} →</button></div>`:''}</section>`}).join('')}</div><div style="margin-top:20px;display:flex;align-items:center;justify-content:space-between"><span class="score">${correct} / ${quizzes.length} 答对</span><button class="btn" data-quiz-reset>重做全部题目</button></div>`+footer()}
function modal(title,content){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=content;$('#modal').showModal()}
function sources(){modal('资料与使用说明',`<p>这是一个本地、离线可用的学习原型。没有连接真实 Kubernetes 集群。模拟值、时间顺序与实例排布只用于解释机制，不是监控数据或性能预测。</p><p>覆盖 ${topics.length} 个核心知识节点，重点是稳定概念。不同 Kubernetes 版本、发行版和插件实现存在差异；实际部署请查对应版本资料。官方链接需要联网打开。</p><p><b>技术事实</b>来自官方概念资料；<b>第一性原理、矛盾主次和产品指标</b>为教学分析，不声称是官方术语或设计者原话。</p><p>主要资料入口（每个知识节点还附有对应专题链接）：</p><ol class="sources-list">${[['组件总览','concepts/overview/components/'],['控制器模式','concepts/architecture/controller/'],['工作负载管理','concepts/workloads/controllers/'],['Pod 生命周期','concepts/workloads/pods/pod-lifecycle/'],['网络与服务发现','concepts/services-networking/'],['持久卷','concepts/storage/persistent-volumes/'],['水平自动扩缩','concepts/workloads/autoscaling/horizontal-pod-autoscale/'],['中断与 PDB','concepts/workloads/pods/disruptions/'],['API 访问控制','concepts/security/controlling-access/'],['Operator 模式','concepts/extend-kubernetes/operator/']].map(([n,p])=>`<li><a href="${BASE+p}" target="_blank" rel="noopener noreferrer">${n} ↗</a></li>`).join('')}</ol><p style="margin-top:20px" class="muted small">已读与测验使用浏览器本地存储；浏览器限制存储时不影响阅读和实验，但不能记忆进度。</p>`)}
function help(){modal('推荐学习路线',`<ol class="mechanism"><li><b>先看架构地图。</b>点击 API Server，理解期望状态、实际状态和责任分工。顶部分类打开全部 ${topics.length} 个节点，支持中英文搜索。</li><li><b>做一次部署实验。</b>手动推进每一步，观察谁创建对象、谁挑节点、谁执行容器。</li><li><b>切换产品设计逻辑。</b>查看组件解决的主要矛盾、伴生约束和产品验收指标。</li><li><b>改变情境。</b>在第一性原理中切换流量、发布、数据和多租户；比较主次矛盾如何变化。</li><li><b>打破正常状态。</b>分别实验 Pod 删除、容器崩溃、节点失联和发布不就绪。扩容实验可调整 CPU 与容量。</li><li><b>用自测检验理解。</b>每个答案都附有解释，可以返回关联知识。</li></ol><div class="boundary">术语提示：对象是 API 中的声明；控制器是协调逻辑；组件进程承载逻辑；插件提供扩展实现。它们不应被混画成同一种东西。</div>`)}
function tweaks(){modal('Tweaks · 阅读设置',`<div class="tweak-body"><label>阅读外观<select id="themeSelect"><option value="blue">工程蓝 · 标准</option><option value="paper">纸本 · 暖色</option><option value="night">夜读 · 深色</option></select></label><label>放大详细说明<input id="largeText" type="checkbox" ${document.body.dataset.large==='true'?'checked':''}></label><p class="small muted">外观切换不影响内容和进度。动画仅用于实验自动推进，可随时暂停。</p></div>`);$('#themeSelect').value=document.body.dataset.theme||'blue';$('#themeSelect').onchange=e=>document.body.dataset.theme=e.target.value;$('#largeText').onchange=e=>document.body.dataset.large=String(e.target.checked)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-topic]');if(!b)return;const d=b.dataset;if(d.page){go(d.page);return}if(d.topic){selectTopic(d.topic);return}if(d.filter){state.filter=d.filter;renderMap();return}if(d.tab){state.tab=d.tab;renderInspector();return}if(d.read){state.read.has(d.read)?state.read.delete(d.read):state.read.add(d.read);save();progress();renderInspector();return}if('clear'in d){state.query='';state.filter='all';renderMap();return}if(d.principle){state.principle=d.principle;renderPrinciples();return}if(d.lab){stop();state.lab=d.lab;state.step=0;renderLab();return}if('step'in d){stop();state.step=Number(d.step);renderLab();return}if('prev'in d||'next'in d){stop();state.step+=('prev'in d?-1:1);renderLab();return}if('play'in d){play();return}if('reset'in d){stop();state.step=0;state.load=100;state.cap=8;renderLab();return}if(d.answer){let [i,a]=d.answer.split(':').map(Number);state.answers[i]=a;save();renderQuiz();return}if('quizReset'in d){state.answers={};save();renderQuiz()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-topic]')){e.preventDefault();selectTopic(e.target.dataset.topic)}});
$('#sourcesBtn').onclick=sources;$('#helpBtn').onclick=help;$('#tweaksBtn').onclick=tweaks;$('#closeModal').onclick=()=>$('#modal').close();$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing){stop();if(state.page==='lab')renderLab()}});
render();

</script></body></html>
